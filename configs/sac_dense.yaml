# PandaReach SAC Dense Baseline

env:
  id: PandaReachDense-v3
  render_mode: rgb_array

train:
  total_timesteps: 50000
  seed: 42
  device: cuda

sac:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 256
  train_freq: 1
  gradient_steps: 1
  gamma: 0.99
  tau: 0.005
  ent_coef: auto

evaluation:
  eval_freq: 5000
  n_eval_episodes: 20
