# PandaReach SAC Dense Baseline

env:
  id: PandaReach-v3
  render_mode: rgb_array

train:
  total_timesteps: 50000
  seed: 44
  device: cuda

sac:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 256
  train_freq: 1
  gradient_steps: 1
  gamma: 0.99
  tau: 0.005
  ent_coef: auto

evaluation:
  eval_freq: 5000
  n_eval_episodes: 20

her:
  n_sampled_goal: 4
  goal_selection_strategy: future
